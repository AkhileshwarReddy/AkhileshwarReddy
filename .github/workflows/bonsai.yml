name: bonsai

on:
  schedule:
    - cron: '0 3 * * *' # re-grow daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs
      # with write access to this repo.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: egorthinks/git-bonsai@665258cab3f304cfb33a96fc7bf108cec1f452f3 # v1.0.0
