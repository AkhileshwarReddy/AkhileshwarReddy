<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-label="Shipping label: Akhileshwar Reddy, backend engineer, Bangalore, India. 6+ years of Ruby on Rails services for logistics and HR/benefits SaaS, built with AI-assisted development using Claude Code.">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, Inter, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'JetBrains Mono', monospace; }
    .cap { font: 700 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, Inter, sans-serif; letter-spacing: 2px; fill: #6e7781; }
    .sticker { transform-box: fill-box; transform-origin: center; opacity: 0;
               animation: thump .7s cubic-bezier(.2,.9,.3,1.2) .8s forwards; }
    .spark { transform-box: fill-box; transform-origin: center; animation: spin 6s linear 1.5s infinite; }
    @keyframes thump {
      0%   { opacity: 0; transform: rotate(-10deg) scale(1.8); }
      70%  { opacity: 1; transform: rotate(-10deg) scale(.94); }
      100% { opacity: 1; transform: rotate(-10deg) scale(1); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
